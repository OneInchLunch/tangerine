[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tangerine-gateway"
version = "0.1.0"
description = "OpenID Connect gateway that authenticates Pulp requests for Tangerine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.9",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "cryptography>=43",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tangerine_gateway*"]

[tool.setuptools.package-data]
tangerine_gateway = ["migrations/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Setting per-request cookies.*:DeprecationWarning",
]
