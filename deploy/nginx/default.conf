server {
    listen 8080;
    server_name _;

    # Keep redirects relative so a proxy on another port does not leak the
    # container's internal 8080 port into Location headers.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /ui/;
    }

    location = /ui {
        return 301 /ui/;
    }

    # Runtime configuration must never be cached, otherwise a ConfigMap update
    # would not be picked up until the browser cache expires.
    location = /ui/config.json {
        expires -1;
        try_files $uri =404;
    }

    location = /ui/index.html {
        expires -1;
        try_files $uri =404;
    }

    location /ui/assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /ui/ {
        expires -1;
        try_files $uri $uri/ /ui/index.html;
    }
}
