{{- $signing := .Values.signing -}}
{{- $scriptsKey := $signing.scriptsSecretKey | default "rpm_script.sh" -}}
{{- if and $signing.enabled (not $signing.existingScriptsSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-signing-scripts" (include "pulp.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "pulp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $scriptsKey }}: |
    {{- .Files.Get "files/rpm_script.sh" | nindent 4 }}
{{- end }}
