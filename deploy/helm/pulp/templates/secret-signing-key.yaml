{{- $signing := .Values.signing -}}
{{- $keyName := $signing.signingKey | default "signing_service.gpg" -}}
{{- if and $signing.enabled (not $signing.existingSecret) $signing.privateKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-signing-key" (include "pulp.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "pulp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $keyName }}: |
    {{- $signing.privateKey | nindent 4 }}
{{- end }}
