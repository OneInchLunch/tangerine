{{- $db := .Values.database -}}
{{- if and (not $db.existingSecret) $db.host -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulp.databaseSecretName" . }}
  labels:
    {{- include "pulp.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_HOST: {{ $db.host | quote }}
  POSTGRES_PORT: {{ $db.port | toString | quote }}
  POSTGRES_USERNAME: {{ $db.username | quote }}
  POSTGRES_PASSWORD: {{ $db.password | quote }}
  POSTGRES_DB_NAME: {{ $db.name | quote }}
  POSTGRES_SSLMODE: {{ $db.sslmode | quote }}
{{- end }}
