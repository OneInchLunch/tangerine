{{- $s3 := .Values.objectStorage.s3 -}}
{{- if and .Values.objectStorage.enabled (not .Values.objectStorage.existingSecret) $s3.bucket -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulp.s3SecretName" . }}
  labels:
    {{- include "pulp.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3-bucket-name: {{ $s3.bucket | quote }}
  {{- with $s3.endpoint }}
  s3-endpoint: {{ . | quote }}
  {{- end }}
  {{- with $s3.region }}
  s3-region: {{ . | quote }}
  {{- end }}
  {{- with $s3.accessKeyId }}
  s3-access-key-id: {{ . | quote }}
  {{- end }}
  {{- with $s3.secretAccessKey }}
  s3-secret-access-key: {{ . | quote }}
  {{- end }}
  s3-addressing-style: {{ $s3.addressingStyle | default "path" | quote }}
{{- end }}
