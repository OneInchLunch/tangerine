{{- if and .Values.gateway.enabled (eq .Values.postgres.mode "internal") (not .Values.postgres.auth.existingSecret) -}}
{{- $name := printf "%s-postgres-configuration" (include "tangerine.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := .Values.postgres.auth.password -}}
{{- if and (not $password) $existing -}}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- end -}}
{{- if not $password -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tangerine.postgresLabels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_HOST: {{ include "tangerine.postgresName" . | quote }}
  POSTGRES_PORT: "5432"
  POSTGRES_USERNAME: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB_NAME: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_SSLMODE: "disable"
{{- end }}
