{{- if .Values.gateway.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tangerine.gatewayName" . }}
  labels:
    {{- include "tangerine.gatewayLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tangerine.gatewaySelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
      protocol: TCP
{{- end }}
