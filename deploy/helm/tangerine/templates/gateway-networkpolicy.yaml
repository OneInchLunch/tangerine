{{- if .Values.gateway.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tangerine.gatewayName" . }}
  labels:
    {{- include "tangerine.gatewayLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tangerine.gatewaySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if or .Values.gateway.allowedNamespaces .Values.gateway.allowedCIDRs }}
    - from:
        {{- range .Values.gateway.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- range .Values.gateway.allowedCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
    {{- end }}
{{- end }}
