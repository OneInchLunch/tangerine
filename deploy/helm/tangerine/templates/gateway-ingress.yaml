{{- if and .Values.ingress.enabled .Values.gateway.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tangerine.gatewayName" . }}
  labels:
    {{- include "tangerine.gatewayLabels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    -
      {{- with .host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ include "tangerine.gatewayPath" $ }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "tangerine.gatewayName" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
