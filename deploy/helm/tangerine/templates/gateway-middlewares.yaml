{{- if and .Values.gateway.enabled .Values.sso.middlewares.enabled -}}
{{- /*
Two Middlewares are required on the Pulp API router, in this order:

  1. strip-identity  removes any client-supplied identity header
  2. forward-auth    asks the gateway who the caller is and injects the header

This chart creates them but cannot attach them: the Pulp API ingress is managed
by Pulp Operator. See NOTES.txt for the annotation to add there.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "tangerine.gatewayName" . }}-strip-identity
  labels:
    {{- include "tangerine.gatewayLabels" . | nindent 4 }}
spec:
  headers:
    customRequestHeaders:
      X-Tangerine-Identity: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "tangerine.gatewayName" . }}-forward-auth
  labels:
    {{- include "tangerine.gatewayLabels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ include "tangerine.gatewayName" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gateway.port }}{{ include "tangerine.gatewayPath" . }}/auth
    authResponseHeaders:
      - X-Tangerine-Identity
    trustForwardHeader: false
{{- end }}
