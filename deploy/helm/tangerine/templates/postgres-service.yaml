{{- if and .Values.gateway.enabled (eq .Values.postgres.mode "internal") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tangerine.postgresName" . }}
  labels:
    {{- include "tangerine.postgresLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tangerine.postgresSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
{{- end }}
