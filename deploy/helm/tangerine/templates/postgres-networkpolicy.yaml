{{- if and .Values.gateway.enabled (eq .Values.postgres.mode "internal") .Values.postgres.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tangerine.postgresName" . }}
  labels:
    {{- include "tangerine.postgresLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tangerine.postgresSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "tangerine.gatewaySelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
